name: optics-monitor

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests pyyaml python-dotenv anthropic

      - name: Run collector
        run: python3 decision_system/collector.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run rules engine
        run: python3 decision_system/rules.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Generate optics report via MiniMax
        run: python3 .github/scripts/optics_report.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          REPORT_TYPE: daily
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          MINIMAX_API_KEY: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          LLM_MODEL: MiniMax-M2.5
          REPORT_FILENAME: optics-${{ github.run_id }}.md

      - name: Run TrendForce monitor
        run: python3 automation/modules/trendforce_monitor.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit report and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$(date '+%Y-%m-%d %H:%M:%S UTC')  [optics-monitor] run=${{ github.run_id }}  conclusion=${{ job.status }}" >> reports/run_log.txt
          git add reports/daily reports/weekly reports/run_log.txt
          git diff --cached --quiet && exit 0
          git pull --rebase origin main
          git commit -m "optics monitor run ${{ github.run_id }}"
          git push

name: optics-monitor

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure folders exist
        run: |
          mkdir -p reports/daily
          mkdir -p reports/weekly
          mkdir -p data
          mkdir -p .claude/commands

      - name: Run Claude Code optical monitor via MiniMax
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: "MiniMax-M2.5"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "MiniMax-M2.5"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "MiniMax-M2.5"
          CLAUDE_CODE_SUBAGENT_MODEL: "MiniMax-M2.5"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
        with:
          prompt: |
            You are running the optical communications monitoring workflow in this repository.

            Follow the repo rules in:
            - CLAUDE.md
            - .claude/commands/watch-optics.md
            - data/watchlist.yaml

            Your task:
            1. Review the optical communications watchlist.
            2. Generate a new daily markdown report in reports/daily/.
            3. The filename must be:
               optics-${{ github.run_id }}.md
            4. The report must include:
               - Summary
               - By ticker
               - Cross-sector signals
               - Priority watchlist
               - Next checkpoints
            5. For each ticker, classify the thesis as:
               - strengthened
               - weakened
               - unchanged
            6. Do not modify existing notes in notes/ unless explicitly required.
            7. Prefer creating a new report file over editing existing files.
            8. If there is not enough new information, explicitly state that the thesis is unchanged and why.

          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily .claude data CLAUDE.md || true
          git diff --cached --quiet || git commit -m "Add optical monitor report"
          git push
